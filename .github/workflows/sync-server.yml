name: Deploy sync server

# The service behind "Sync & sharing" (bunny.walczaki.com), deployed like ip.walczaki.com:
# image to GHCR, then server/k8s.yaml applied on the VPS's k3s.
on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/sync-server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sync-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-sync

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 server/test_sync_server.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to k3s
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${GITHUB_SHA}|" server/k8s.yaml \
            | ssh debian@${{ secrets.VPS_HOST }} \
                'export KUBECONFIG=$HOME/.kube/config
                 kubectl apply -f - &&
                 kubectl delete configmap -n bunny sync-server --ignore-not-found &&
                 kubectl rollout status -n bunny deployment/sync-server --timeout=180s ||
                 { kubectl get pods -n bunny; kubectl describe pods -n bunny -l app=sync-server | tail -20; exit 1; }'
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://bunny.walczaki.com/healthz
