name: Deploy sync server

# The service behind "Sync & sharing" (bunny.walczaki.com), on the VPS's k3s.
on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/sync-server.yml
  workflow_dispatch:

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 server/test_sync_server.py

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'debian' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          remote="/tmp/bunny-sync-server-${GITHUB_RUN_NUMBER}.py"
          scp -i ~/.ssh/id_vps -P "$VPS_PORT" -o BatchMode=yes server/sync_server.py "$VPS_USER@$VPS_HOST:$remote"
          ssh -i ~/.ssh/id_vps -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$remote'; rc=\$?; rm -f '$remote'; exit \$rc" < server/deploy.sh
