name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # If any test fails, the job stops here: no APK and no release.
      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # versionCode = GITHUB_RUN_NUMBER, so the in-app updater can tell newer builds apart.
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk bunny-player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bunny-player-apk
          path: bunny-player.apk

      # Every push to main (or a manual "Run workflow" on main) becomes a GitHub Release,
      # so the newest APK is always at
      # https://github.com/mwalczak/player/releases/latest/download/bunny-player.apk
      # and installed apps offer it as an update.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bunny Player build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Download bunny-player.apk on the phone / tablet / TV and open it to install.
            Already installed? The app offers this update by itself.
          files: bunny-player.apk
          make_latest: true

  # Optional mirror of the APK on PicoShare (android.all.apk keeps its link). Never fails the build.
  picoshare:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bunny-player-apk

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::VPS secrets not set, skipping PicoShare upload"; exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to PicoShare
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'debian' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          [ -f ~/.ssh/id_vps ] || exit 0
          ssh_opts=(-i ~/.ssh/id_vps -p "$VPS_PORT" -o BatchMode=yes)
          remote="/tmp/bunny-player-${GITHUB_RUN_NUMBER}.apk"
          scp -i ~/.ssh/id_vps -P "$VPS_PORT" -o BatchMode=yes bunny-player.apk "$VPS_USER@$VPS_HOST:$remote"
          note="Bunny Player build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          set -o pipefail
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$remote' $(printf '%q' "$note") 365 android.all.apk; rc=\$?; rm -f '$remote'; exit \$rc" \
            < scripts/picoshare-upload.sh 2>&1 | tee upload.log
          url=$(sed -n 's/^PICOSHARE_URL=//p' upload.log)
          echo "### 📦 APK on PicoShare: $url" >> "$GITHUB_STEP_SUMMARY"
