name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set - APK is signed with a throwaway debug key and won't install over a previous build."
          fi

      - name: Unit tests and release build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="bunny-player-${version}-${GITHUB_SHA::7}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to PicoShare
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'debian' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          APK: ${{ needs.build.outputs.apk_name }}
        run: |
          ssh_opts=(-i ~/.ssh/id_vps -p "$VPS_PORT" -o BatchMode=yes)
          remote="/tmp/$APK"
          scp -i ~/.ssh/id_vps -P "$VPS_PORT" -o BatchMode=yes "$APK" "$VPS_USER@$VPS_HOST:$remote"
          note="Bunny Player ${GITHUB_SHA::7} ($(git log -1 --format=%s | cut -c1-80))"
          out=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$remote' $(printf '%q' "$note") 365 android.all.apk; rc=\$?; rm -f '$remote'; exit \$rc" < scripts/picoshare-upload.sh)
          echo "$out"
          url=$(echo "$out" | sed -n 's/^PICOSHARE_URL=//p')
          echo "### 📦 APK uploaded to PicoShare" >> "$GITHUB_STEP_SUMMARY"
          echo "**$APK** → $url" >> "$GITHUB_STEP_SUMMARY"
