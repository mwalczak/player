name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # If any test fails, the job stops here: no APK and no release.
      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # versionCode = GITHUB_RUN_NUMBER, so the in-app updater can tell newer builds apart.
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk bunny-player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bunny-player-apk
          path: bunny-player.apk

      # Every push to main (or a manual "Run workflow" on main) becomes a GitHub Release,
      # so the newest APK is always at
      # https://github.com/mwalczak/player/releases/latest/download/bunny-player.apk
      # and installed apps offer it as an update.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bunny Player build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Download bunny-player.apk on the phone / tablet / TV and open it to install.
            Already installed? The app offers this update by itself.
          files: bunny-player.apk
          make_latest: true
